services:
  - type: web
    name: kichik-oyinlar-bot
    env: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

    # Render injects PORT automatically; app reads os.getenv("PORT", "8000").
    # WEBAPP_URL must be set to this service's public URL after first deploy,
    # e.g. https://kichik-oyinlar-bot.onrender.com
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GLOBAL_DATABASE_URL
        sync: false
      - key: GAME_DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: WEBAPP_URL
        sync: false          # set to https://<your-app>.onrender.com after deploy
      - key: DEVELOPER_MODE
        value: "false"
      - key: RENDER
        value: "true"        # used by main.py to switch to stdout-only logging
