<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Do'mboqchalar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --panel-bg: rgba(20,22,34,0.62);
    --panel-bd: rgba(255,255,255,0.14);
    --gold: #ffd166;
    --gold-dark: #e8a12e;
    --ink: #fff8ea;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none;}
  html,body{margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0b0d18; font-family:'Fredoka', sans-serif; touch-action:none;}
  #game{position:fixed; inset:0; width:100%; height:100%; display:block;}
  #ui-root{position:fixed; inset:0; pointer-events:none; font-family:'Fredoka', sans-serif;}
  .screen{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; pointer-events:auto;
    background:radial-gradient(ellipse at 50% 20%, rgba(60,50,90,0.35), rgba(6,7,14,0.78) 70%);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);}
  .hidden{display:none !important;}
  .logo{font-family:'Baloo 2', sans-serif; font-weight:800; font-size:clamp(38px,9vw,64px); color:var(--ink);
    text-shadow: 0 3px 0 rgba(0,0,0,0.35), 0 10px 24px rgba(0,0,0,0.45); letter-spacing:1px; text-align:center;}
  .logo span{color:var(--gold); text-shadow:0 3px 0 rgba(120,70,0,0.5), 0 10px 24px rgba(0,0,0,0.45);}
  .sub{color:rgba(255,255,255,0.75); font-size:14px; margin-top:-14px; letter-spacing:2px; text-transform:uppercase;}
  .char-preview{width:150px; height:150px; border-radius:50%; position:relative; margin-top:6px;
    box-shadow: inset 0 0 0 4px rgba(255,255,255,0.15), 0 14px 30px rgba(0,0,0,0.5);}
  .char-preview canvas{width:100%; height:100%; display:block;}
  .btn{font-family:'Baloo 2', sans-serif; font-weight:700; font-size:20px; color:#3b2a12; letter-spacing:0.5px;
    background:linear-gradient(180deg, #ffe27a, var(--gold) 55%, var(--gold-dark)); border:none; border-radius:20px;
    padding:16px 42px; cursor:pointer; box-shadow: 0 6px 0 #a86f14, 0 14px 24px rgba(0,0,0,0.4); transition: transform .08s, box-shadow .08s;}
  .btn:active{transform:translateY(5px); box-shadow: 0 1px 0 #a86f14, 0 6px 12px rgba(0,0,0,0.35);}
  .btn.secondary{background:linear-gradient(180deg, #6fe0ce, #33b6a3 55%, #1f8a7c); color:#0c2e29; box-shadow:0 6px 0 #146357, 0 14px 24px rgba(0,0,0,0.4);}
  .btn.secondary:active{box-shadow:0 1px 0 #146357, 0 6px 12px rgba(0,0,0,0.35);}
  .btn.ghost{background:rgba(255,255,255,0.12); color:var(--ink); box-shadow:0 6px 0 rgba(0,0,0,0.25), 0 10px 20px rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.25);}
  .row{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
  .best-row{display:flex; gap:22px; color:var(--ink); font-size:15px; opacity:0.9;}
  .best-row b{color:var(--gold); font-family:'Baloo 2';}
  .tg-status{font-size:12px; color:rgba(255,248,234,0.75); max-width:260px; text-align:center; line-height:1.5; margin-top:-4px;}
  #coin-badge{position:absolute; top:16px; right:16px; display:flex; align-items:center; gap:8px; background:var(--panel-bg);
    border:1px solid var(--panel-bd); padding:8px 16px 8px 10px; border-radius:999px; color:var(--ink); font-weight:600; font-size:16px;
    box-shadow:0 8px 18px rgba(0,0,0,0.35);}
  #coin-badge .coin-icon{width:22px; height:22px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff6cf, var(--gold) 55%, var(--gold-dark)); box-shadow:inset 0 -2px 3px rgba(120,70,0,0.5);}

  #shop-screen{justify-content:flex-start; padding-top:70px; gap:10px;}
  .shop-title{font-family:'Baloo 2'; font-weight:800; font-size:30px; color:var(--ink); margin-bottom:2px;}
  #char-grid{display:grid; grid-template-columns:repeat(2, minmax(140px,1fr)); gap:14px; max-width:520px; width:92vw; padding:14px 0 90px;
    overflow-y:auto; max-height:70vh;}
  .char-card{position:relative; background:var(--panel-bg); border:1px solid var(--panel-bd); border-radius:18px; padding:12px 10px 14px;
    display:flex; flex-direction:column; align-items:center; gap:6px; box-shadow:0 10px 20px rgba(0,0,0,0.35); transition:transform .12s;}
  .char-card.selected{outline:3px solid var(--gold); box-shadow:0 0 0 3px rgba(255,209,102,0.25), 0 10px 20px rgba(0,0,0,0.35);}
  .char-card canvas{width:78px; height:78px;}
  .char-card .cname{color:var(--ink); font-weight:600; font-size:15px;}
  .char-card .cworld{color:rgba(255,255,255,0.55); font-size:10.5px; text-align:center; line-height:1.3; min-height:26px;}
  .char-card .cbtn{margin-top:2px; font-family:'Baloo 2'; font-weight:700; font-size:13px; padding:7px 16px; border-radius:12px; border:none; cursor:pointer;}
  .cbtn.locked{background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.6);}
  .cbtn.buy{background:linear-gradient(180deg,#ffe27a,var(--gold)); color:#3b2a12; box-shadow:0 4px 0 #a86f14;}
  .cbtn.select{background:linear-gradient(180deg,#8de0ff,#4aa9dc); color:#082a3a; box-shadow:0 4px 0 #1f6e94;}
  .cbtn.equipped{background:rgba(120,220,160,0.25); color:#bdf3d0; border:1px solid rgba(140,230,170,0.5);}
  .lock-badge{position:absolute; top:8px; left:8px; background:rgba(0,0,0,0.55); color:#fff; font-size:11px; padding:3px 7px; border-radius:8px;}

  #hud{position:absolute; inset:0; pointer-events:none;}
  #score-wrap{position:absolute; top:16px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center;}
  #score-val{font-family:'Baloo 2'; font-weight:800; font-size:44px; color:#fff; text-shadow:0 3px 0 rgba(0,0,0,0.35), 0 8px 18px rgba(0,0,0,0.4);}
  #score-lbl{font-size:11px; letter-spacing:3px; color:rgba(255,255,255,0.7); margin-top:-6px;}
  #pause-btn{position:absolute; top:14px; left:78px; width:42px; height:42px; border-radius:50%; background:var(--panel-bg); border:1px solid var(--panel-bd);
    color:#fff; font-size:16px; display:flex; align-items:center; justify-content:center; pointer-events:auto; box-shadow:0 8px 16px rgba(0,0,0,0.3);}
  #heart-badge{position:absolute; top:16px; left:16px; display:flex; align-items:center; gap:7px; background:var(--panel-bg);
    border:1px solid var(--panel-bd); padding:8px 14px 8px 10px; border-radius:999px; color:#ff6b7a; font-weight:700; font-size:16px;
    box-shadow:0 8px 18px rgba(0,0,0,0.35);}
  #heart-badge .heart-icon{font-size:18px; filter:drop-shadow(0 2px 2px rgba(0,0,0,0.4));}
  #heart-badge span{color:var(--ink);}
  #quit-btn{position:absolute; bottom:22px; right:18px; width:50px; height:50px; border-radius:50%; background:var(--panel-bg); border:1px solid var(--panel-bd);
    color:#ffd1d1; font-size:20px; display:flex; align-items:center; justify-content:center; pointer-events:auto; box-shadow:0 8px 16px rgba(0,0,0,0.3);}
  #idle-warn{position:absolute; bottom:26%; left:50%; transform:translateX(-50%); color:#ffb1b1; font-family:'Baloo 2'; font-weight:700; font-size:15px;
    letter-spacing:1px; opacity:0; text-shadow:0 2px 6px rgba(0,0,0,0.6);}
  #touch-zones{position:absolute; inset:0; display:flex; pointer-events:auto;}
  #touch-zones div{flex:1; height:100%;}

  .final-score{font-family:'Baloo 2'; font-weight:800; font-size:56px; color:var(--gold); text-shadow:0 4px 0 rgba(120,70,0,0.4), 0 10px 20px rgba(0,0,0,0.4);}
  .go-title{font-family:'Baloo 2'; font-weight:700; font-size:22px; color:rgba(255,255,255,0.85); letter-spacing:2px;}
  #mute-btn{position:absolute; top:70px; right:16px; width:42px; height:42px; border-radius:50%; background:var(--panel-bg); border:1px solid var(--panel-bd);
    color:#fff; font-size:16px; display:flex; align-items:center; justify-content:center; pointer-events:auto; box-shadow:0 8px 16px rgba(0,0,0,0.3);}
  @keyframes floaty{0%{transform:translateY(0)}50%{transform:translateY(-8px)}100%{transform:translateY(0)}}
  .float{animation:floaty 2.6s ease-in-out infinite;}

  /* ---- Leaderboard ---- */
  .lb-title{font-family:'Baloo 2'; font-weight:800; font-size:26px; color:var(--ink); margin-bottom:-6px;}
  .lb-tabs-row{display:flex; gap:8px; justify-content:center;}
  .lb-tab{padding:8px 22px; border-radius:12px; border:1px solid var(--panel-bd); background:rgba(255,255,255,0.1);
    color:var(--ink); font-weight:700; font-family:'Baloo 2'; cursor:pointer; font-size:14px;}
  .lb-tab.active{background:linear-gradient(180deg,#ffe27a,var(--gold)); color:#3b2a12;}
  .lb-list{display:flex; flex-direction:column; gap:6px; max-width:340px; width:88vw; max-height:34vh; overflow-y:auto;}
  .lb-row{display:flex; align-items:center; gap:10px; background:var(--panel-bg); border:1px solid var(--panel-bd);
    border-radius:12px; padding:8px 12px;}
  .lb-row.lb-me{border-color:var(--gold); background:rgba(255,209,102,0.18);}
  .lb-rank{font-weight:800; color:var(--gold); min-width:26px; text-align:left; font-family:'Baloo 2';}
  .lb-name{flex:1; text-align:left; color:var(--ink); font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lb-score{font-weight:800; color:#8de0ff; font-size:13px;}
  .lb-empty{color:rgba(255,255,255,0.65); font-size:12.5px; padding:10px 0;}

  /* ---- Admin panel (owner-only: upload a custom character image) ---- */
  #adminBtn{
    pointer-events:auto; margin-top:10px; padding:9px 20px; font-size:13px; font-weight:700;
    color:#fff; background:linear-gradient(180deg,#5a6a8a,#2c3650);
    border:1px solid rgba(255,255,255,0.18); border-radius:12px; cursor:pointer;
  }
  #adminModal{
    position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    background:rgba(4,6,10,0.78); backdrop-filter:blur(3px); padding:16px;
  }
  #adminModal.hidden{ display:none; }
  .admin-card{
    width:100%; max-width:420px; max-height:88vh; overflow-y:auto;
    background:linear-gradient(180deg,#1b2130,#12151d);
    border:1px solid rgba(255,255,255,0.1); border-radius:20px;
    padding:22px 22px 26px; color:#fff; box-shadow:0 20px 50px rgba(0,0,0,0.6); font-family:'Fredoka',sans-serif;
  }
  .admin-card h2{ margin:0 0 4px; font-size:19px; color:var(--gold); }
  .admin-sub{ font-size:12px; color:#8f9aad; margin-bottom:16px; }
  .admin-section{
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07);
    border-radius:14px; padding:14px; margin-bottom:14px;
  }
  .admin-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .file-label{
    display:inline-block; padding:9px 16px; border-radius:10px; font-size:13px; font-weight:600;
    background:linear-gradient(180deg,#3a4256,#242a38); border:1px solid rgba(255,255,255,0.12);
    cursor:pointer; color:#fff;
  }
  .admin-preview{
    width:64px; height:64px; border-radius:10px; object-fit:contain; background:#0c0e13;
    border:1px solid rgba(255,255,255,0.15); display:none;
  }
  .admin-preview.show{ display:block; }
  #playerPreview.show{
    background-image:
      linear-gradient(45deg,#555 25%,transparent 25%), linear-gradient(-45deg,#555 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#555 75%), linear-gradient(-45deg,transparent 75%,#555 75%);
    background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0px; background-color:#333;
  }
  .clear-btn{
    background:none; border:1px solid rgba(255,90,90,0.4); color:#ff8a8a; border-radius:8px;
    padding:6px 10px; font-size:12px; cursor:pointer;
  }
  .admin-note{ font-size:11px; color:#69748a; margin-top:10px; line-height:1.5; }
  .admin-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:6px; }

</style>
</head>

      <div class="lb-tab active" data-scope="global">Global</div>
      <div class="lb-tab" data-scope="group">Guruh</div>
    </div>
    <div class="lb-list" id="lb-list-go"></div>

      <button class="btn" id="retry-btn">QAYTA URINISH</button>
      <button class="btn ghost" id="go-menu-btn">MENYU</button>
    </div>
  </div>

  <button id="mute-btn">🔊</button>
</div>

<script>

"use strict";

/* ======================= UTIL ======================= */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

let storageReady = false;

async function loadProfile(){
  try{
    const raw = localStorage.getItem('domboqchalar_profile');
    if(raw){
      const p = JSON.parse(raw);
      profile = Object.assign(JSON.parse(JSON.stringify(DEFAULT_PROFILE)), p);
      if(!profile.unlocked.includes('panda')) profile.unlocked.push('panda');
    }
  }catch(e){ /* first run or storage unavailable */ }
  storageReady = true;
  refreshMenuUI();
}
let saveTimer=null;
function saveProfile(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem('domboqchalar_profile', JSON.stringify(profile)); }catch(e){}
  }, 250);
}
loadProfile();

/* ======================= AUDIO ENGINE ======================= */

  init(){
    if(this.ctx) return;
    const AC = window.AudioContext||window.webkitAudioContext;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value=0.55;
    this.delay = this.ctx.createDelay(1.0); this.delay.delayTime.value=0.34;
    this.delayGain = this.ctx.createGain(); this.delayGain.gain.value=0.28;
    this.delay.connect(this.delayGain); this.delayGain.connect(this.delay);
    this.delayGain.connect(this.master);
    this.master.connect(this.ctx.destination);
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  setMuted(m){ this.muted=m; if(this.master) this.master.gain.value = m?0:0.55; },
  stopTheme(){
    if(this.noteTimer){ clearTimeout(this.noteTimer); this.noteTimer=null; }
    this.droneNodes.forEach(n=>{ try{ n.osc.stop(); }catch(e){} try{n.osc.disconnect();n.gain.disconnect();}catch(e){} });
    this.droneNodes=[];
  },
  playTheme(themeKey){
    this.init(); this.resume();
    if(this.current===themeKey) return;
    this.stopTheme();
    this.current = themeKey;
    const t = THEMES[themeKey];
    const ctx=this.ctx;
    const filt = ctx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=t.filter;
    filt.connect(this.master); filt.connect(this.delay);
    this._filt = filt;
    // drone pad: two detuned oscillators
    [0, 0.06].forEach((det,i)=>{
      const osc=ctx.createOscillator(); osc.type='sine';
      osc.frequency.value = t.root/2 * (1+det);
      const g=ctx.createGain(); g.gain.value=0;
      osc.connect(g); g.connect(filt);
      osc.start();
      const now=ctx.currentTime;
      g.gain.linearRampToValueAtTime(0.05, now+3);
      this.droneNodes.push({osc,gain:g});
      // slow LFO swell
      const swell=()=>{
        if(this.current!==themeKey) return;
        const n=ctx.currentTime;
        g.gain.linearRampToValueAtTime(rand(0.035,0.075), n+rand(3,6));
        this._swellTimer=setTimeout(swell, rand(3000,6000));
      };
      setTimeout(swell, 1000+i*500);
    });
    const scheduleNote=()=>{
      if(this.current!==themeKey) return;
      const now=ctx.currentTime;
      const degree=choice(t.scale);
      const octave=choice([1,1,2]);
      const freq = t.root*Math.pow(2,degree/12)*octave/ (Math.random()<0.5?1:2);
      const osc=ctx.createOscillator(); osc.type=t.wave;
      osc.frequency.value=freq;
      const g=ctx.createGain(); g.gain.value=0;
      osc.connect(g); g.connect(filt); g.connect(this.delay);
      osc.start(now);
      g.gain.linearRampToValueAtTime(0.12, now+0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, now+1.4);
      osc.stop(now+1.5);
      this.noteTimer=setTimeout(scheduleNote, t.tempo*rand(0.85,1.3));
    };
    this.noteTimer=setTimeout(scheduleNote, 300);
  },
  sfx(type){
    this.init(); this.resume();
    const ctx=this.ctx; const now=ctx.currentTime;
    const g=ctx.createGain(); g.connect(this.master);
    if(type==='jump'){
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(420,now);
      o.frequency.exponentialRampToValueAtTime(680,now+0.09);
      g.gain.setValueAtTime(0.16,now); g.gain.exponentialRampToValueAtTime(0.0001,now+0.16);
      o.connect(g); o.start(now); o.stop(now+0.18);
    } else if(type==='land'){
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(220,now);
      g.gain.setValueAtTime(0.14,now); g.gain.exponentialRampToValueAtTime(0.0001,now+0.12);
      o.connect(g); o.start(now); o.stop(now+0.14);
    } else if(type==='coin'){
      const o=ctx.createOscillator(); o.type='square'; o.frequency.setValueAtTime(880,now);
      o.frequency.setValueAtTime(1320,now+0.06);
      g.gain.setValueAtTime(0.09,now); g.gain.exponentialRampToValueAtTime(0.0001,now+0.22);
      o.connect(g); o.start(now); o.stop(now+0.24);
    } else if(type==='crack'){
      const bufSize=ctx.sampleRate*0.2;
      const buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<bufSize;i++) d[i]=(Math.random()*2-1)*(1-i/bufSize);
      const src=ctx.createBufferSource(); src.buffer=buf;
      const f=ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=800;
      g.gain.setValueAtTime(0.22,now);
      src.connect(f); f.connect(g); src.start(now);
    } else if(type==='fall'){
      const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(500,now);
      o.frequency.exponentialRampToValueAtTime(70,now+0.6);
      g.gain.setValueAtTime(0.13,now); g.gain.exponentialRampToValueAtTime(0.0001,now+0.65);
      o.connect(g); o.start(now); o.stop(now+0.66);
    } else if(type==='gameover'){
      const o=ctx.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(180,now);
      o.frequency.exponentialRampToValueAtTime(60,now+0.8);
      g.gain.setValueAtTime(0.18,now); g.gain.exponentialRampToValueAtTime(0.0001,now+0.9);
      o.connect(g); o.start(now); o.stop(now+0.95);
    } else if(type==='click'){
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(700,now);
      g.gain.setValueAtTime(0.08,now); g.gain.exponentialRampToValueAtTime(0.0001,now+0.08);
      o.connect(g); o.start(now); o.stop(now+0.09);
    }
  }
};

/* ======================= GAME STATE ======================= */
const STATE={MENU:'menu',SHOP:'shop',PLAY:'play',PAUSE:'pause',OVER:'over'};
let state=STATE.MENU;
let currentTheme = THEMES[profile.selected] ? profile.selected : 'panda';

const SCALE=1; // world units == px at zoom 1
const VIEW_ANCHOR=0.68; // player kept at 68% down the screen
let camera={alt:0, target:0, x:0, targetX:0};
let runCoins=0;
let jumpScore=0;
let bestFlashShown=false;

/* =====================================================================
   PLATFORM GENERATION SYSTEM (rewritten from scratch)
   -----------------------------------------------------------------
   Rules:
   - The main path is a single, clean zigzag: LEFT -> RIGHT -> LEFT -> RIGHT
     forever. Direction flips on every single main platform, no exceptions.
   - Horizontal and vertical spacing use a fixed base value with only a
     small amount of jitter, so the rhythm stays smooth and predictable
     instead of feeling random.
   - Every fake path is short (2-4 platforms), appears rarely (roughly
     every 30-50 main platforms), clearly dead-ends, and never rejoins
     the main path on its own - the player must jump back to it.
   - Spacing is chosen from the player's real jump range, so every step
     is always reachable and platforms never sit inside one another.
===================================================================== */
let platforms=[];
let particles=[];
let ambientParticles=[];

const PLAT_W = 100;         // standard platform width
const PLAT_H = 200;         // fixed platform vertical (side-face) length
const START_W = 110;        // first platform is extra wide/safe

const STEP_DX = 65;         // base horizontal distance between steps (-35px gap / 35px overlap between facing edges)
const STEP_DX_JITTER = 0;   // no variance, so the gap stays exactly 0px
const STEP_DY = 46;         // base vertical rise between steps
const STEP_DY_JITTER = 6;

const FAKE_EVERY_MIN = 30;  // fake path shows up every 30-50 main platforms
const FAKE_EVERY_MAX = 50;
const FAKE_LEN_MIN = 2;     // fake paths are 2-4 platforms long
const FAKE_LEN_MAX = 4;

function makePlatform(x,alt,opts){
  return Object.assign({
    x, alt, w:PLAT_W, gap:STEP_DY, next:null,
    broken:false, shakeT:0, crackLevel:0, coin:false,
    falling:false, fallVy:0,
    id:Math.random()
  }, opts||{});
}

// generator state - all of it lives here, nowhere else
const gen = { dir:1, x:0, alt:0, sinceFake:0, nextFakeAt:0, lastMain:null, runLeft:0 };

function resetWorld(){
  platforms=[]; particles=[]; ambientParticles=[];
  gen.dir=1; gen.x=0; gen.alt=0; gen.sinceFake=0; gen.runLeft=0;
  gen.nextFakeAt = Math.floor(rand(FAKE_EVERY_MIN, FAKE_EVERY_MAX));
  const first = makePlatform(0,0,{main:true, wide:true, w:START_W, gap:STEP_DY+30});
  platforms.push(first);
  gen.lastMain = first;
  genAheadTo(1400);
}

// weighted run-length: 1-3 ko'proq, 4-6 o'rtacha, 7-10 kamroq uchraydi
function pickRunLength(){
  const roll = Math.random();
  if(roll < 0.55) return Math.floor(rand(1,4));   // 1-3, eng ko'p
  if(roll < 0.88) return Math.floor(rand(4,7));   // 4-6, o'rtacha
  return Math.floor(rand(7,11));                  // 7-10, kam
}

// place the next platform on the single true main path (always flips side)
function stepMain(){
  if(gen.runLeft<=0){
    gen.dir = -gen.dir;
    gen.runLeft = pickRunLength();
  }
  gen.runLeft--;
  const dx = (STEP_DX + rand(-STEP_DX_JITTER, STEP_DX_JITTER)) * gen.dir;
  const dy = STEP_DY + rand(-STEP_DY_JITTER, STEP_DY_JITTER);
  gen.x = clamp(gen.x + dx, -2000, 2000);
  gen.alt = gen.alt + dy;
  const p = makePlatform(gen.x, gen.alt, {main:true, coin: Math.random()<0.15, gap:dy});
  platforms.push(p);
  if(gen.lastMain) gen.lastMain.next = p;
  gen.lastMain = p;
  gen.sinceFake++;
  return p;
}

// a short dead-end branch that peels off the main path to bait the player
function spawnFakePath(originPlatform){
  const len = Math.floor(rand(FAKE_LEN_MIN, FAKE_LEN_MAX+1));
  let fx=originPlatform.x, falt=originPlatform.alt;
  let fdir=gen.dir; // repeats the direction just used on the main path - breaks the strict alternation, which is what makes it deceptive
  for(let i=0;i<len;i++){
    const dx=(STEP_DX + rand(-STEP_DX_JITTER,STEP_DX_JITTER)) * fdir;
    const dy=STEP_DY + rand(-STEP_DY_JITTER,STEP_DY_JITTER);
    fx = clamp(fx+dx, -190, 190);
    falt = falt+dy;
    platforms.push(makePlatform(fx, falt, {main:false, decoy:true, coin: Math.random()<0.15, gap:dy}));
    fdir=-fdir; // still zig-zags a little so it visually reads as a real path
  }
  // intentionally no further connection - this branch just stops, forcing the player back onto the main path
}

function genAheadTo(targetAlt){
  while(gen.alt < targetAlt){
    stepMain();
  }
}

function pruneBelow(alt){
  platforms = platforms.filter(p => p.alt > alt-260);
}

/* ======================= PLAYER ======================= */
const player={
  x:0, alt:0, curPlat:null,
  vx:0, vy:0, falling:false,
  jumping:false, jt:0, jdur:0, jsx:0,jsalt:0, jex:0,jealt:0, jdir:1,
  hanging:false, hangT:0, voidFall:false, everJumped:false, ridingFall:false,
  idle:0, squash:1, squashY:1, facing:1, bob:0, dead:false, invuln:0
};
const MAX_LIVES=1;
let livesLeft=MAX_LIVES;
let lastSafePlat=null;
function updateHeartsUI(){ document.getElementById('lives-val').textContent=livesLeft; }
function loseLife(){
  if(state!==STATE.PLAY) return;
  livesLeft--; updateHeartsUI();
  if(livesLeft<=0){ endGame(); return; }
  player.jumping=false; player.falling=false; player.hanging=false; player.voidFall=false; player.ridingFall=false; player.vx=0; player.vy=0; player.idle=0; player.invuln=1.1;
  const p=lastSafePlat || platforms[0];
  player.curPlat=p; player.x=p.x; player.alt=p.alt;
  spawnBurst(p.x,p.alt+16,'#ff6b7a',16);
}

function landOn(plat){
  player.curPlat=plat; player.alt=plat.alt; player.x=plat.x;
  player.jumping=false; player.falling=false; player.idle=0; player.voidFall=false;
  player.squash=1.35; player.squashY=0.7;
  lastSafePlat=plat;
  jumpScore++;
  spawnBurst(plat.x, plat.alt, THEMES[currentTheme].accent, 10);
  if(plat.coin && !plat.collected){
    plat.collected=true;
    runCoins += 1; document.getElementById('run-coins').textContent=runCoins;
    Audio_.sfx('coin');
    spawnBurst(plat.x, plat.alt+18, '#ffe27a', 14);
  }
}

function startJump(dir){
  if(state!==STATE.PLAY || player.dead) return;
  if(player.jumping || player.falling || player.hanging || player.ridingFall) return;
  const from = player.curPlat;
  if(!from) return;
  player.everJumped = true;
  from.falling = true; from.fallVy = 0;
  // the only valid landing spot is the actual next stone on the path -
  // and only if the tapped direction matches the side it's actually on
  let best=null;
  const next = player.curPlat ? player.curPlat.next : null;
  if(next){
    const ddx = next.x - from.x;
    if((dir>0 && ddx>6) || (dir<0 && ddx<-6)) best=next;
  }
  player.facing=dir;
  Audio_.sfx('jump');
  if(best){
    player.jumping=true; player.jt=0;
    const dist=Math.hypot(best.x-from.x, best.alt-from.alt);
    player.jdur=clamp(dist/260, 0.28, 0.62);
    player.jsx=from.x; player.jsalt=from.alt;
    player.jex=best.x; player.jealt=best.alt;
    player.jdir=dir; player.pendingLand=best;
    player.curPlat=null;
  } else {
    // tosh yo'q tomonga sakraldi - havoda 40px uzoqlikda muallaq to'xtaydi
    player.jumping=true; player.jt=0; player.jdur=0.32;
    player.jsx=from.x; player.jsalt=from.alt;
    player.jex=from.x+dir*80; player.jealt=from.alt;
    player.pendingLand=null; player.curPlat=null; player.voidFall=true;
  }
}

/* ======================= PARTICLES ======================= */
function spawnBurst(x,alt,color,n){
  for(let i=0;i<n;i++){
    particles.push({x,alt,vx:rand(-90,90),vy:rand(40,160),life:0,maxLife:rand(0.4,0.8),size:rand(2,4.5),color,grav:true});
  }
}
function spawnAmbient(theme,viewTopAlt,viewBotAlt){
  const kind=theme.particle;
  const count = kind==='snow'?1:1;
  for(let i=0;i<count;i++){
    if(ambientParticles.length>140) return;
    const x=rand(-260,260);
    const alt=viewTopAlt+rand(0,40);
    if(kind==='snow') ambientParticles.push({type:kind,x,alt,vx:rand(-8,8),vy:-rand(28,55),sway:rand(0,TAU),size:rand(2,4),life:0,maxLife:20});
    else if(kind==='leaf-autumn'||kind==='leaf-bamboo'||kind==='leaf-euca') ambientParticles.push({type:kind,x,alt,vx:rand(-14,14),vy:-rand(18,34),sway:rand(0,TAU),size:rand(4,8),rot:rand(0,TAU),life:0,maxLife:22,color:theme.particleColor});
    else if(kind==='petal') ambientParticles.push({type:kind,x,alt,vx:rand(-16,16),vy:-rand(16,30),sway:rand(0,TAU),size:rand(3,6),rot:rand(0,TAU),life:0,maxLife:20});
    else if(kind==='firefly') ambientParticles.push({type:kind,x:rand(-260,260),alt:rand(viewBotAlt,viewTopAlt),vx:rand(-6,6),vy:rand(-6,6),phase:rand(0,TAU),size:rand(2,3.5),life:0,maxLife:99999});
  }
}

/* ======================= RENDER HELPERS ======================= */
function worldToScreen(x,alt){
  return {sx: W/2 + (x - camera.x), sy: H*VIEW_ANCHOR - (alt - camera.alt)};
}
function skyGradient(theme){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,theme.sky[0]); g.addColorStop(0.55,theme.sky[1]); g.addColorStop(1,theme.sky[2]);
  return g;
}
let auroraPhase=0;
function drawBackground(theme,dt){
  ctx.fillStyle=skyGradient(theme);
  ctx.fillRect(0,0,W,H);
  if(theme.aurora){
    auroraPhase+=dt*0.15;
    for(let i=0;i<3;i++){
      const yy = H*0.18 + i*26 + Math.sin(auroraPhase+i)*14;
      const grad=ctx.createLinearGradient(0,yy-40,0,yy+40);
      const hue=140+i*40+Math.sin(auroraPhase*2+i)*20;
      grad.addColorStop(0,`hsla(${hue},80%,65%,0)`);
      grad.addColorStop(0.5,`hsla(${hue},80%,65%,0.22)`);
      grad.addColorStop(1,`hsla(${hue},80%,65%,0)`);
      ctx.fillStyle=grad;
      ctx.fillRect(0,yy-40,W,80);
    }
  }
  // parallax mountain/forest layers based on camera
  drawParallaxLayer(theme.far, 0.08, 0.62, 46, theme);
  drawParallaxLayer(theme.mid, 0.16, 0.72, 34, theme);
  drawParallaxLayer(theme.near,0.28, 0.84, 24, theme);
  // fog band
  ctx.fillStyle=theme.fog;
  ctx.fillRect(0,H*0.55,W,H*0.5);
}
function drawParallaxLayer(color,parallax,baseY,amp,theme){
  ctx.fillStyle=color;
  ctx.beginPath();
  const offset=(camera.alt*parallax)%160;
  const y0=H*baseY;
  ctx.moveTo(-40,H+20);
  for(let x=-40;x<=W+40;x+=40){
    const px=x+ (-offset);
    const yy=y0 - Math.abs(Math.sin((px+camera.alt*0.02)*0.012))*amp - Math.sin(px*0.004)*amp*0.4;
    ctx.lineTo(x,yy);
  }
  ctx.lineTo(W+40,H+20);
  ctx.closePath(); ctx.fill();
  if(theme.mist && parallax>0.2){
    ctx.save(); ctx.globalAlpha=0.18;
    ctx.fillStyle='#ffffff';
    for(let i=0;i<3;i++){
      const mx=((camera.alt*0.05+i*260)%(W+300))-150;
      ctx.beginPath(); ctx.ellipse(mx, y0+10+i*8, 140,22,0,0,TAU); ctx.fill();
    }
    ctx.restore();
  }
}

function drawPlatform(theme,p){
  const s=worldToScreen(p.x,p.alt);
  if(s.sy<-260||s.sy>H+260) return;
  const shakeX = p.shakeT>0 ? Math.sin(p.shakeT*60)*p.shakeT*6 : 0;
  const sx=s.sx+shakeX, sy=s.sy;
  const w=p.w;
  const hw=w*0.5, hh=w*0.25;
  const faceH = PLAT_H;
  ctx.save();
  // ground shadow
  ctx.globalAlpha=0.25; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(sx, sy+faceH+hh*0.7, hw*0.85, hh*0.6,0,0,TAU); ctx.fill();
  ctx.globalAlpha=1;

  const topCol=p.theme_top||theme.platform.top;
  const sideCol=p.theme_side||theme.platform.side;
  const darkCol=lighten(sideCol,-38);

  // LEFT face (shadow side)
  ctx.fillStyle=darkCol;
  ctx.beginPath();
  ctx.moveTo(sx-hw, sy);
  ctx.lineTo(sx, sy+hh);
  ctx.lineTo(sx, sy+hh+faceH);
  ctx.lineTo(sx-hw, sy+faceH);
  ctx.closePath(); ctx.fill();

  // RIGHT face (front, lit + patterned)
  const rGrad=ctx.createLinearGradient(0,sy,0,sy+faceH+hh);
  rGrad.addColorStop(0, sideCol);
  rGrad.addColorStop(1, lighten(sideCol,-16));
  ctx.fillStyle=rGrad;
  ctx.beginPath();
  ctx.moveTo(sx+hw, sy);
  ctx.lineTo(sx, sy+hh);
  ctx.lineTo(sx, sy+hh+faceH);
  ctx.lineTo(sx+hw, sy+faceH);
  ctx.closePath(); ctx.fill();
  // diamond motif pattern on the front face
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(sx+hw, sy); ctx.lineTo(sx, sy+hh); ctx.lineTo(sx, sy+hh+faceH); ctx.lineTo(sx+hw, sy+faceH);
  ctx.closePath(); ctx.clip();
  ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1.6;
  const rows = faceH>95? 2:1;
  for(let r=0;r<rows;r++){
    const pcx=sx+hw*0.48, pcy=sy+hh*0.6+faceH*(rows===2?(0.3+r*0.42):0.42);
    const dw=hw*0.32, dh=faceH*0.15;
    ctx.beginPath();
    ctx.moveTo(pcx,pcy-dh); ctx.lineTo(pcx+dw,pcy); ctx.lineTo(pcx,pcy+dh); ctx.lineTo(pcx-dw,pcy); ctx.closePath();
    ctx.stroke();
  }
  ctx.restore();
  // subtle edge highlight
  ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(sx,sy+hh); ctx.lineTo(sx,sy+hh+faceH); ctx.stroke();

  // TOP face (diamond)
  const tGrad=ctx.createLinearGradient(sx-hw,sy-hh,sx+hw,sy+hh);
  tGrad.addColorStop(0, lighten(topCol,14));
  tGrad.addColorStop(1, topCol);
  ctx.fillStyle=tGrad;
  ctx.beginPath();
  ctx.moveTo(sx, sy-hh);
  ctx.lineTo(sx+hw, sy);
  ctx.lineTo(sx, sy+hh);
  ctx.lineTo(sx-hw, sy);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=1.2; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(sx, sy-hh*0.45); ctx.lineTo(sx+hw*0.45, sy); ctx.lineTo(sx, sy+hh*0.45); ctx.lineTo(sx-hw*0.45, sy);
  ctx.closePath(); ctx.stroke();

  // theme accent decoration perched on the top face
  drawPlatformDeco(theme,sx,sy-hh*0.15,w,p);

  // crack overlay across the top face
  if(p.crackLevel>0){
    ctx.strokeStyle='rgba(30,20,10,0.65)'; ctx.lineWidth=1.6;
    ctx.beginPath();
    ctx.moveTo(sx-hw*0.3,sy-3); ctx.lineTo(sx+hw*0.05,sy+4); ctx.lineTo(sx-hw*0.15,sy+hh*0.6);
    if(p.crackLevel>1){ ctx.moveTo(sx+hw*0.3,sy-4); ctx.lineTo(sx+hw*0.05,sy+3); }
    ctx.stroke();
  }
  // coin
  if(p.coin && !p.collected){
    const cy=sy-32+Math.sin(performance.now()/300+p.id*10)*4;
    const cg=ctx.createRadialGradient(sx-3,cy-3,1,sx,cy,9);
    cg.addColorStop(0,'#fff6cf'); cg.addColorStop(1,'#e8a12e');
    ctx.fillStyle=cg;
    ctx.beginPath(); ctx.ellipse(sx,cy,8,8,0,0,TAU); ctx.fill();
    ctx.strokeStyle='rgba(140,80,0,0.4)'; ctx.lineWidth=1.4; ctx.stroke();
  }
  ctx.restore();
}
function drawPlatformDeco(theme,sx,sy,w,p){
  ctx.save();
  switch(theme.particle){
    case 'leaf-bamboo':
      ctx.strokeStyle='rgba(90,140,80,0.8)'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(sx-w*0.24,sy-6); ctx.lineTo(sx-w*0.24,sy-20); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(sx-w*0.24-6,sy-22,6,3,-0.4,0,TAU); ctx.fillStyle='#8fbf6a'; ctx.fill();
      break;
    case 'snow':
      ctx.fillStyle='rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.ellipse(sx-w*0.16,sy-7,9,4,0,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(180,230,255,0.55)';
      ctx.beginPath(); ctx.moveTo(sx+w*0.16,sy-6); ctx.lineTo(sx+w*0.16+7,sy-1); ctx.lineTo(sx+w*0.16-2,sy-1); ctx.closePath(); ctx.fill();
      break;
    case 'petal':
      ctx.fillStyle='#ffd1e6';
      for(let i=0;i<3;i++){ ctx.beginPath(); ctx.ellipse(sx-w*0.22+i*9, sy-6-((i%2)*3), 4.5,2.8, i,0,TAU); ctx.fill(); }
      break;
    case 'leaf-autumn':
      ctx.strokeStyle='#7a4a24'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(sx-w*0.2,sy-5); ctx.lineTo(sx-w*0.2,sy-15); ctx.stroke();
      ctx.fillStyle='#ff9a4a';
      ctx.beginPath(); ctx.ellipse(sx-w*0.2,sy-17,6.5,4.6,0.3,0,TAU); ctx.fill();
      break;
    case 'firefly':
      ctx.fillStyle='rgba(180,150,200,0.55)';
      ctx.beginPath(); ctx.ellipse(sx+w*0.18,sy-6,8,3.6,0,0,TAU); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(sx-w*0.08,sy-7); ctx.lineTo(sx+w*0.04,sy-7); ctx.stroke();
      break;
    case 'leaf-euca':
      ctx.fillStyle='#cfe3c2';
      ctx.beginPath(); ctx.ellipse(sx-w*0.2,sy-9,6.4,3.6,0.6,0,TAU); ctx.fill();
      ctx.fillStyle='#9fc78f';
      ctx.beginPath(); ctx.ellipse(sx+w*0.16,sy-7,5.4,3,-0.4,0,TAU); ctx.fill();
      break;
  }
  ctx.restore();
}
/* ambient particles render */
function drawAmbient(theme,dt){
  for(let i=ambientParticles.length-1;i>=0;i--){
    const a=ambientParticles[i];
    a.life+=dt;
    if(a.type==='firefly'){
      a.x+=Math.sin(a.phase+performance.now()/900)*10*dt;
      a.alt+=Math.cos(a.phase+performance.now()/700)*8*dt;
    } else {
      a.sway+=dt*1.4;
      a.x += (a.vx + Math.sin(a.sway)*18)*dt;
      a.alt += a.vy*dt;
    }
    const s=worldToScreen(a.x,a.alt);
    if(s.sy<-40||s.sy>H+40 || a.life>a.maxLife){ ambientParticles.splice(i,1); continue; }
    ctx.save();
    if(a.type==='snow'){
      ctx.globalAlpha=0.85; ctx.fillStyle='#ffffff';
      ctx.beginPath(); ctx.arc(s.sx,s.sy,a.size,0,TAU); ctx.fill();
    } else if(a.type==='firefly'){
      const flick=0.5+0.5*Math.sin(performance.now()/260+a.phase);
      ctx.globalAlpha=0.5+flick*0.5;
      ctx.fillStyle='#ffe08a';
      ctx.shadowColor='#ffe08a'; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(s.sx,s.sy,a.size,0,TAU); ctx.fill();
    } else if(a.type==='petal'){
      ctx.globalAlpha=0.9; ctx.fillStyle=theme.particleColor;
      ctx.translate(s.sx,s.sy); ctx.rotate(a.rot+performance.now()/900);
      ctx.beginPath(); ctx.ellipse(0,0,a.size,a.size*0.55,0,0,TAU); ctx.fill();
    } else {
      ctx.globalAlpha=0.9; ctx.fillStyle=a.color||theme.particleColor;
      ctx.translate(s.sx,s.sy); ctx.rotate(a.rot+performance.now()/700);
      ctx.beginPath(); ctx.ellipse(0,0,a.size,a.size*0.6,0,0,TAU); ctx.fill();
    }
    ctx.restore();
  }
}
function drawBurstParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life+=dt;
    if(p.life>p.maxLife){ particles.splice(i,1); continue; }
    p.x+=p.vx*dt; p.alt+=p.vy*dt;
    if(p.grav) p.vy-=260*dt;
    const s=worldToScreen(p.x,p.alt);
    const t=1-p.life/p.maxLife;
    ctx.save(); ctx.globalAlpha=clamp(t,0,1);
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(s.sx,s.sy,p.size*t+1,0,TAU); ctx.fill();
    ctx.restore();
  }
}

/* ======================= CHARACTER DRAWING ======================= */
function drawCharacterAt(g,cx,cy,size,theme,squashX,squashY,facing,bob,anim,scared,showFace){
  g.save();
  g.translate(cx,cy+bob);
  // ground contact shadow
  g.save();
  g.fillStyle='rgba(20,15,10,0.28)';
  g.beginPath(); g.ellipse(0, size*1.14, size*0.5, size*0.13, 0,0,TAU); g.fill();
  g.restore();

  g.scale(facing<0?1:-1,1);
  if(scared){ g.translate(Math.sin(performance.now()/40)*2, 0); }
  g.rotate(-0.05); // slight lean into the direction it's facing
  g.scale(squashX,squashY);
  const r=size;
  const isPanda = theme===THEMES.panda;
  const isPenguin = theme===THEMES.penguin;
  const isFox = theme===THEMES.fox;
  const isRedpanda = theme===THEMES.redpanda;
  const isRabbit = theme===THEMES.rabbit;
  const isKoala = theme===THEMES.koala;
  const paw = theme.patch==='#ffffff' ? lighten(theme.body,-22) : theme.patch;

  // natural per-species coloring for legs/arms/paws
  let legColor, armColor, pawColor;
  if(isPanda){ legColor=theme.patch; armColor=theme.patch; pawColor=theme.patch; }
  else if(isPenguin){ legColor='#e8862f'; armColor=theme.body; pawColor='#e8862f'; }
  else if(isFox){ legColor='#2a1f18'; armColor=theme.body; pawColor='#2a1f18'; }
  else if(isRedpanda){ legColor='#2a1f18'; armColor=lighten(theme.body,-6); pawColor='#2a1f18'; }
  else if(isRabbit){ legColor=theme.blush; armColor=lighten(theme.body,-6); pawColor=theme.blush; }
  else if(isKoala){ legColor=lighten(theme.body,-15); armColor=lighten(theme.body,-6); pawColor=lighten(theme.body,-15); }
  else { legColor=paw; armColor=lighten(theme.body,-6); pawColor=paw; }

  const hasTail = true;

  // ---- LEGS / FEET ----
  g.fillStyle=legColor;
  if(isRabbit){
    // big hind legs
    g.beginPath(); g.ellipse(-r*0.32, r*1.04, r*0.26,r*0.19,0,0,TAU); g.fill();
    g.beginPath(); g.ellipse(r*0.32, r*1.04, r*0.26,r*0.19,0,0,TAU); g.fill();
  } else if(isPenguin){
    // wide webbed feet
    g.beginPath(); g.ellipse(-r*0.26, r*1.06, r*0.26,r*0.13,0,0,TAU); g.fill();
    g.beginPath(); g.ellipse(r*0.26, r*1.06, r*0.26,r*0.13,0,0,TAU); g.fill();
  } else {
    g.beginPath(); g.ellipse(-r*0.3, r*1.02, r*0.22,r*0.15,0,0,TAU); g.fill();
    g.beginPath(); g.ellipse(r*0.3, r*1.02, r*0.22,r*0.15,0,0,TAU); g.fill();
  }

  // ---- ARMS (tucked slightly behind, back view) ----
  if(isPenguin){
    // thin flippers instead of arms - no separate paw
    g.fillStyle=armColor;
    g.beginPath(); g.ellipse(-r*0.66, r*0.42, r*0.13,r*0.32,0.5,0,TAU); g.fill();
    g.beginPath(); g.ellipse(r*0.66, r*0.42, r*0.13,r*0.32,-0.5,0,TAU); g.fill();
  } else {
    g.fillStyle=armColor;
    g.beginPath(); g.ellipse(-r*0.62, r*0.44, r*0.15,r*0.26,0.35,0,TAU); g.fill();
    g.beginPath(); g.ellipse(r*0.62, r*0.44, r*0.15,r*0.26,-0.35,0,TAU); g.fill();
    g.fillStyle=pawColor;
    g.beginPath(); g.ellipse(-r*0.66, r*0.66, r*0.12,r*0.12,0,0,TAU); g.fill();
    g.beginPath(); g.ellipse(r*0.66, r*0.66, r*0.12,r*0.12,0,0,TAU); g.fill();
  }

  // ---- TORSO (3D shaded) ----
  const torsoGrad=g.createRadialGradient(-r*0.22,r*0.22,r*0.15, r*0.05,r*0.55,r*0.95);
  torsoGrad.addColorStop(0, lighten(theme.body,22));
  torsoGrad.addColorStop(0.6, theme.body);
  torsoGrad.addColorStop(1, lighten(theme.body,-16));
  g.fillStyle=torsoGrad;
  g.beginPath(); g.ellipse(0, r*0.55, r*0.56, r*0.6, 0,0,TAU); g.fill();
  // rim shadow (bottom-right edge) for volume
  g.save();
  g.globalAlpha=0.28; g.fillStyle='#000';
  g.beginPath(); g.ellipse(r*0.16, r*0.68, r*0.42, r*0.46, 0,0,TAU); g.clip();
  g.beginPath(); g.ellipse(r*0.3, r*0.8, r*0.5, r*0.5, 0,0,TAU); g.fill();
  g.restore();
  // panda: black saddle patch across the shoulders, connecting the two arms
  if(isPanda){
    g.fillStyle=theme.patch;
    g.beginPath(); g.ellipse(0, r*0.12, r*0.5, r*0.24, 0,0,TAU); g.fill();
  }

  // ---- TAIL (drawn on top of the body so it's clearly visible, natural shape per species) ----
  if(!showFace){
  if(isFox){
    // fox tail, same size as the rabbit's tail, with a white tip for identity
    g.fillStyle=theme.body;
    g.beginPath(); g.ellipse(r*0.1, r*0.94, r*0.28, r*0.26, 0.1, 0, TAU); g.fill();
    g.fillStyle=theme.patch;
    g.beginPath(); g.ellipse(r*0.16, r*1.06, r*0.12, r*0.11, 0.1, 0, TAU); g.fill();
  } else if(isRedpanda){
    // ringed tail, same size as the rabbit's tail
    g.save();
    g.translate(r*0.1, r*0.88); g.rotate(-0.3);
    for(let i=0;i<2;i++){
      g.fillStyle = i%2===0 ? theme.body : '#2a1f18';
      g.beginPath(); g.ellipse(0, i*r*0.16, r*0.15, r*0.13, 0, 0, TAU); g.fill();
      g.translate(0, r*0.14);
    }
    g.restore();
  } else if(isRabbit){
    // round cotton-ball tail, sized to match the body
    g.fillStyle='#ffffff';
    g.beginPath(); g.ellipse(r*0.1, r*0.94, r*0.28, r*0.26, 0.1, 0, TAU); g.fill();
  } else if(isPenguin){
    // short, stiff, pointed tail - real penguins use this to prop themselves upright
    g.fillStyle=lighten(theme.body,-10);
    g.beginPath();
    g.moveTo(-r*0.14, r*0.86);
    g.lineTo(r*0.14, r*0.86);
    g.lineTo(0, r*1.5);
    g.closePath(); g.fill();
  } else if(isPanda){
    // small round tail, sized to match the body
    g.fillStyle=theme.patch;
    g.beginPath(); g.ellipse(r*0.06, r*0.96, r*0.18, r*0.16, 0.1, 0, TAU); g.fill();
  } else if(isKoala){
    // small round tail, sized to match the body
    g.fillStyle=lighten(theme.body,-12);
    g.beginPath(); g.ellipse(r*0.06, r*0.96, r*0.16, r*0.15, 0.1, 0, TAU); g.fill();
  } else {
    // default small round tail, sized to match the body
    g.fillStyle=lighten(theme.body,-10);
    g.beginPath(); g.ellipse(r*0.06, r*0.96, r*0.16, r*0.15, 0.1, 0, TAU); g.fill();
  }
  }

  // ---- HEAD (back of head, on top of body) ----
  g.save();
  g.translate(0,-r*0.62);
  const bodyGrad=g.createRadialGradient(-r*0.28,-r*0.4,r*0.2, r*0.05,r*0.1,r*1.2);
  bodyGrad.addColorStop(0, lighten(theme.body,26));
  bodyGrad.addColorStop(0.6, theme.body);
  bodyGrad.addColorStop(1, lighten(theme.body,-14));
  g.fillStyle=bodyGrad;
  g.beginPath(); g.ellipse(0,0,r,r*0.92,0,0,TAU); g.fill();
  // rim shadow lower-right for roundness
  g.save();
  g.globalAlpha=0.25; g.fillStyle='#000';
  g.beginPath(); g.ellipse(0,0,r,r*0.92,0,0,TAU); g.clip();
  g.beginPath(); g.ellipse(r*0.35,r*0.3,r*0.75,r*0.75,0,0,TAU); g.fill();
  g.restore();
  // ears (seen from behind too)
  drawEars(g,r,theme);
  if(showFace){
    // face patch / mask
    drawFacePatch(g,r,theme);
    // blush
    g.fillStyle=theme.blush; g.globalAlpha=0.55;
    g.beginPath(); g.ellipse(-r*0.55,r*0.12,r*0.16,r*0.1,0,0,TAU); g.fill();
    g.beginPath(); g.ellipse(r*0.55,r*0.12,r*0.16,r*0.1,0,0,TAU); g.fill();
    g.globalAlpha=1;
    // eyes
    g.fillStyle='#2a2118';
    g.beginPath(); g.ellipse(-r*0.32,-r*0.04,r*0.1,r*0.13,0,0,TAU); g.fill();
    g.beginPath(); g.ellipse(r*0.32,-r*0.04,r*0.1,r*0.13,0,0,TAU); g.fill();
    g.fillStyle='#fff';
    g.beginPath(); g.arc(-r*0.32-2,-r*0.09,r*0.03,0,TAU); g.fill();
    g.beginPath(); g.arc(r*0.32-2,-r*0.09,r*0.03,0,TAU); g.fill();
    // nose
    g.fillStyle='#2a2118';
    g.beginPath(); g.ellipse(0,r*0.12,r*0.09,r*0.07,0,0,TAU); g.fill();
  } else {
    // glossy highlight for a toy-like 3D feel (back of head)
    g.save();
    g.globalAlpha=0.35; g.fillStyle='#fff';
    g.beginPath(); g.ellipse(-r*0.32,-r*0.42,r*0.22,r*0.14,-0.4,0,TAU); g.fill();
    g.restore();
  }
  g.restore();

  g.restore();
}

/* Draws the admin-uploaded custom character image in place of the
   procedural character, with the same ground shadow + squash/facing. */
function drawCustomPlayerAt(g,cx,cy,size,squashX,squashY,facing,bob){
  g.save();
  g.translate(cx,cy+bob);
  g.save();
  g.fillStyle='rgba(20,15,10,0.28)';
  g.beginPath(); g.ellipse(0, size*1.14, size*0.5, size*0.13, 0,0,TAU); g.fill();
  g.restore();
  g.scale(facing<0?1:-1,1);
  g.scale(squashX,squashY);
  const aspect = (customPlayerImg.naturalWidth && customPlayerImg.naturalHeight)
    ? customPlayerImg.naturalWidth / customPlayerImg.naturalHeight : 1;
  const targetH = size*2.3;
  const targetW = targetH * aspect;
  g.drawImage(customPlayerImg, -targetW/2, -targetH*0.82, targetW, targetH);
  g.restore();
}
function drawEars(g,r,theme){
  g.fillStyle=theme.patch;
  if(theme===THEMES.rabbit){
    g.beginPath(); g.ellipse(-r*0.35,-r*1.05,r*0.22,r*0.55,-0.15,0,TAU); g.fill();
    g.beginPath(); g.ellipse(r*0.35,-r*1.05,r*0.22,r*0.55,0.15,0,TAU); g.fill();
    g.fillStyle=theme.blush;
    g.beginPath(); g.ellipse(-r*0.35,-r*1.05,r*0.1,r*0.36,-0.15,0,TAU); g.fill();
    g.beginPath(); g.ellipse(r*0.35,-r*1.05,r*0.1,r*0.36,0.15,0,TAU); g.fill();
  } else if(theme===THEMES.koala){
    g.beginPath(); g.arc(-r*0.85,-r*0.55,r*0.42,0,TAU); g.fill();
    g.beginPath(); g.arc(r*0.85,-r*0.55,r*0.42,0,TAU); g.fill();
  } else if(theme===THEMES.redpanda){
    g.beginPath(); g.arc(-r*0.65,-r*0.85,r*0.3,0,TAU); g.fill();
    g.beginPath(); g.arc(r*0.65,-r*0.85,r*0.3,0,TAU); g.fill();
    g.fillStyle='#3a2a1e';
    g.beginPath(); g.arc(-r*0.65,-r*0.85,r*0.16,0,TAU); g.fill();
    g.beginPath(); g.arc(r*0.65,-r*0.85,r*0.16,0,TAU); g.fill();
  } else if(theme===THEMES.fox){
    g.beginPath(); g.moveTo(-r*0.6,-r*0.6); g.lineTo(-r*0.85,-r*1.25); g.lineTo(-r*0.25,-r*0.85); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(r*0.6,-r*0.6); g.lineTo(r*0.85,-r*1.25); g.lineTo(r*0.25,-r*0.85); g.closePath(); g.fill();
    g.fillStyle='#2a2118';
    g.beginPath(); g.moveTo(-r*0.6,-r*0.65); g.lineTo(-r*0.78,-r*1.1); g.lineTo(-r*0.4,-r*0.82); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(r*0.6,-r*0.65); g.lineTo(r*0.78,-r*1.1); g.lineTo(r*0.4,-r*0.82); g.closePath(); g.fill();
  } else if(theme===THEMES.penguin){
    // no ears, no head tuft
  } else { // panda
    g.beginPath(); g.arc(-r*0.72,-r*0.78,r*0.34,0,TAU); g.fill();
    g.beginPath(); g.arc(r*0.72,-r*0.78,r*0.34,0,TAU); g.fill();
  }
}
function drawFacePatch(g,r,theme){
  if(theme===THEMES.panda){
    g.fillStyle=theme.patch; g.globalAlpha=0.92;
    g.beginPath(); g.ellipse(-r*0.32,-r*0.06,r*0.2,r*0.24,-0.2,0,TAU); g.fill();
    g.beginPath(); g.ellipse(r*0.32,-r*0.06,r*0.2,r*0.24,0.2,0,TAU); g.fill();
    g.globalAlpha=1;
  } else if(theme===THEMES.redpanda || theme===THEMES.koala){
    g.fillStyle=theme.patch; g.globalAlpha=0.95;
    g.beginPath(); g.ellipse(0,r*0.05,r*0.62,r*0.5,0,0,TAU); g.fill();
    g.globalAlpha=1;
  } else if(theme===THEMES.fox){
    g.fillStyle=theme.patch; g.globalAlpha=0.95;
    g.beginPath(); g.ellipse(0,r*0.15,r*0.5,r*0.42,0,0,TAU); g.fill();
    g.globalAlpha=1;
  } else if(theme===THEMES.penguin){
    g.fillStyle=theme.patch;
    g.beginPath(); g.ellipse(0,r*0.22,r*0.55,r*0.62,0,0,TAU); g.fill();
    g.fillStyle='#e8862f';
    g.beginPath(); g.moveTo(-r*0.12,r*0.06); g.lineTo(r*0.12,r*0.06); g.lineTo(0,r*0.24); g.closePath(); g.fill();
  }
}
function lighten(hex,amt){
  const c=hex.replace('#','');
  const num=parseInt(c.length===3? c.split('').map(x=>x+x).join(''):c,16);
  let r=(num>>16)+amt, gg=((num>>8)&0xff)+amt, b=(num&0xff)+amt;
  r=clamp(r,0,255); gg=clamp(gg,0,255); b=clamp(b,0,255);
  return `rgb(${r},${gg},${b})`;
}

/* ======================= MENU / SHOP CHARACTER PREVIEW ======================= */
function renderPreviewCanvas(cv,themeKey,animT){
  const c=cv.getContext('2d');
  const w=cv.width,h=cv.height;
  c.clearRect(0,0,w,h);
  const theme=THEMES[themeKey];
  const grad=c.createRadialGradient(w/2,h*0.42,10,w/2,h*0.5,w*0.55);
  grad.addColorStop(0, theme.sky[1]); grad.addColorStop(1, theme.sky[2]);
  c.fillStyle=grad; c.beginPath(); c.arc(w/2,h/2,w/2,0,TAU); c.fill();
  const bob=Math.sin((animT||0)/450)*4;
  drawCharacterAt(c, w/2, h*0.48, w*0.24, theme, 1,1,1, bob, null, false, true);
}

/* ======================= SHOP ======================= */
function buildShop(){
  const grid=document.getElementById('char-grid');
  grid.innerHTML='';
  CHAR_ORDER.forEach(key=>{
    const t=THEMES[key];
    const unlocked=profile.unlocked.includes(key);
    const selected=profile.selected===key;
    const card=document.createElement('div');
    card.className='char-card'+(selected?' selected':'');
    const cv=document.createElement('canvas'); cv.width=120; cv.height=120;
    card.appendChild(cv);
    if(!unlocked){
      const lb=document.createElement('div'); lb.className='lock-badge'; lb.textContent='🔒 '+t.cost; card.appendChild(lb);
    }
    const nm=document.createElement('div'); nm.className='cname'; nm.textContent=t.emoji+' '+t.name; card.appendChild(nm);
    const wd=document.createElement('div'); wd.className='cworld'; wd.textContent=t.world; card.appendChild(wd);
    const btn=document.createElement('button');
    if(!unlocked){
      btn.className='cbtn buy'; btn.textContent="Ochish "+t.cost;
      btn.onclick=()=>{
        Audio_.sfx('click');
        if(profile.coins>=t.cost){
          profile.coins-=t.cost; profile.unlocked.push(key); profile.selected=key;
          saveProfile(); refreshMenuUI();
        } else {
          btn.textContent=(t.cost-profile.coins)+" ta yetishmayapti";
          setTimeout(()=>{ btn.textContent="Ochish "+t.cost; },1100);
        }
      };
    } else if(selected){
      btn.className='cbtn equipped'; btn.textContent='Tanlangan';
    } else {
      btn.className='cbtn select'; btn.textContent='Tanlash';
      btn.onclick=()=>{
        Audio_.sfx('click');
        profile.selected=key; saveProfile(); currentTheme=key; refreshMenuUI();
      };
    }
    card.appendChild(btn);
    grid.appendChild(card);
    setTimeout(()=>renderPreviewCanvas(cv,key,performance.now()+Math.random()*1000),0);
  });
}
setInterval(()=>{
  if(state===STATE.SHOP){
    document.querySelectorAll('#char-grid canvas').forEach((cv,i)=>{
      renderPreviewCanvas(cv, CHAR_ORDER[i], performance.now()+i*300);
    });
  }
},60);

function show(id){ document.getElementById(id).classList.remove('hidden'); }
function hide(id){ document.getElementById(id).classList.add('hidden'); }
function goMenu(){
  state=STATE.MENU;
  hide('hud'); hide('shop-screen'); hide('pause-screen'); hide('gameover-screen');
  show('menu-screen');
  currentTheme=profile.selected;
  Audio_.playTheme(currentTheme);
  refreshMenuUI();
}
function openShop(){ state=STATE.SHOP; hide('menu-screen'); show('shop-screen'); buildShop(); }
function closeShop(){ state=STATE.MENU; hide('shop-screen'); show('menu-screen'); }

function startGame(){
  tryUnlockAudio();
  currentTheme=profile.selected;
  Audio_.playTheme(currentTheme);
  resetWorld();
  camera.alt=0; camera.target=0; camera.x=0; camera.targetX=0;
  player.x=0; player.alt=0; player.curPlat=platforms[0]; player.falling=false; player.jumping=false; player.hanging=false; player.voidFall=false; player.ridingFall=false; player.everJumped=false; player.dead=false; player.idle=0;
  runCoins=0; jumpScore=0; document.getElementById('run-coins').textContent='0';
  livesLeft=MAX_LIVES; updateHeartsUI();
  lastSafePlat=platforms[0];
  state=STATE.PLAY;
  scoreSubmitted=false;
  showTgStatus('');
  hide('menu-screen'); hide('shop-screen'); hide('gameover-screen'); hide('pause-screen'); show('hud');
  document.getElementById('score-val').textContent='0';
}
function togglePause(){
  if(state===STATE.PLAY){ state=STATE.PAUSE; show('pause-screen'); }
  else if(state===STATE.PAUSE){ state=STATE.PLAY; hide('pause-screen'); }
}
function endGame(){
  if(state===STATE.OVER) return;
  state=STATE.OVER;
  Audio_.sfx('gameover');
  const scoreM=jumpScore;
  profile.coins += runCoins;
  const isBest = scoreM>profile.best;
  if(isBest) profile.best=scoreM;
  const cKey=profile.selected;
  profile.bestByChar[cKey]=Math.max(profile.bestByChar[cKey]||0, scoreM);
  saveProfile();
  document.getElementById('go-score').textContent=scoreM;
  document.getElementById('go-best').textContent=profile.best;
  document.getElementById('go-coins').textContent=runCoins;
  hide('hud');
  show('gameover-screen');

  // Leaderboard Integration
  submitScore(scoreM);
  setupLbTabs(document.getElementById('lb-tabs-go'), document.getElementById('lb-list-go'));
  // End Leaderboard Integration
}

// Leaderboard Integration
const GAME_SLUG = "domboqchalar";
const tg = window.Telegram?.WebApp;
if(tg) tg.ready();

let scoreSubmitted = false;

function showTgStatus(msg){
  const el = document.getElementById('tg-status');
  if(!el) return;
  el.textContent = msg;
  el.classList.toggle('hidden', !msg);
}

function safeChatId(){
  const raw = new URLSearchParams(location.search).get('cid');
  const n = Number(raw);
  if(!Number.isFinite(n)) return 0;
  return n;
}

async function submitScore(score){
  if(scoreSubmitted) return; // one POST per game round
  const initData = tg?.initData || "";
  if(!tg || !initData || !initData.trim()){
    showTgStatus("Telegram Mini App orqali oching.");
    return; // never POST with empty init_data
  }
  scoreSubmitted = true;
  const finalScore = Number(score);
  const chatId = safeChatId();
  try{
    const response = await fetch('/api/scores', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        game: GAME_SLUG,
        score: finalScore,
        init_data: initData,
        chat_id: chatId
      })
    });
    if(!response.ok){
      showTgStatus("Natijani yuborib bo'lmadi.");
    } else {
      const activeTab = document.querySelector('#lb-tabs-go .lb-tab.active');
      loadLeaderboardInto(document.getElementById('lb-list-go'), activeTab ? activeTab.dataset.scope : 'global');
    }
  }catch(e){
    // Never crash the game if the network fails
  }
}
/* ---- Leaderboard fetch/render (global vs group tabs) ---- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function fetchLeaderboard(scope){
  const chatId = safeChatId();
  if(scope === 'group' && !chatId) return null;
  try{
    let url = '/api/scores?game=' + GAME_SLUG + '&scope=' + scope;
    if(scope === 'group') url += '&chat_id=' + chatId;
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    return Array.isArray(data) ? data : (Array.isArray(data.leaderboard) ? data.leaderboard : null);
  }catch(e){
    return null;
  }
}
function renderLeaderboardInto(container, list){
  if(!container) return;
  if(list === null){
    container.innerHTML = '<div class="lb-empty">Reytingni yuklab bo\'lmadi.</div>';
    return;
  }
  if(list.length === 0){
    container.innerHTML = '<div class="lb-empty">Hozircha reyting mavjud emas.</div>';
    return;
  }
  const myId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? String(tg.initDataUnsafe.user.id) : null;
  container.innerHTML = list.map((row, i) => {
    const name = row.name || row.first_name || row.username || ("O'yinchi " + (i+1));
    const sc = (row.score !== undefined) ? row.score : (row.best_score !== undefined ? row.best_score : '');
    const rowId = row.user_id !== undefined ? row.user_id : (row.id !== undefined ? row.id : (row.telegram_id !== undefined ? row.telegram_id : null));
    const isMe = myId !== null && rowId !== null && String(rowId) === myId;
    return '<div class="lb-row' + (isMe ? ' lb-me' : '') + '">'
      + '<span class="lb-rank">#' + (i+1) + '</span>'
      + '<span class="lb-name">' + escapeHtml(name) + '</span>'
      + '<span class="lb-score">' + escapeHtml(sc) + '</span>'
      + '</div>';
  }).join('');
}
function loadLeaderboardInto(container, scope){
  if(!container) return;
  container.innerHTML = '<div class="lb-empty">Yuklanmoqda...</div>';
  fetchLeaderboard(scope || 'global').then(list => renderLeaderboardInto(container, list));
}
function setupLbTabs(tabsEl, container){
  if(!tabsEl || !container) return;
  const btns = tabsEl.querySelectorAll('.lb-tab');
  btns.forEach(b => {
    b.onclick = () => {
      btns.forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      loadLeaderboardInto(container, b.dataset.scope);
    };
  });
  const activeBtn = tabsEl.querySelector('.lb-tab.active') || btns[0];
  loadLeaderboardInto(container, activeBtn ? activeBtn.dataset.scope : 'global');
}

/* Chroma-key: turns green-screen pixels transparent so an uploaded
   character photo (shot in front of a green background) shows up
   in-game without its green backdrop. */
function removeGreenScreen(dataUrl){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      for(let i=0;i<data.length;i+=4){
        const r=data[i], g=data[i+1], b=data[i+2];
        const greenness = g - Math.max(r,b);
        if(g > 60 && greenness > 40){
          data[i+3] = 0;
        } else if(g > 50 && greenness > 15){
          const t = (greenness - 15) / (40 - 15);
          data[i+3] = Math.round(data[i+3] * (1 - t));
          data[i+1] = Math.round(g - t * (g - Math.max(r,b)));
        }
      }
      ctx.putImageData(imageData, 0, 0);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

/* ======================= MAIN LOOP ======================= */
let lastT=performance.now();
const IDLE_WARN_T=1.7, IDLE_BREAK_T=2.6;

function updateGame(dt){
  const theme=THEMES[currentTheme];
  if(player.invuln>0) player.invuln=Math.max(0,player.invuln-dt);

  if(player.jumping){
    player.jt += dt/player.jdur;
    const t=clamp(player.jt,0,1);
    const ease = t<0.5? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    const arc = Math.sin(Math.PI*t)*70;
    player.x = lerp(player.jsx, player.jex, ease);
    player.alt = lerp(player.jsalt, player.jealt, ease) + arc;
    player.squash = lerp(0.8,1,Math.abs(t-0.5)*2);
    player.squashY = lerp(1.25,1,Math.abs(t-0.5)*2);
    if(t>=1){
      if(player.pendingLand){ landOn(player.pendingLand); }
      else { player.jumping=false; player.hanging=true; player.hangT=0; }
    }
  } else if(player.hanging){
    // havoda muallaq to'xtab, ko'zlarini ikki marotaba yumadi, so'ng pastga yiqiladi
    player.hangT += dt;
    player.squash=1; player.squashY=1;
    if(player.hangT >= 0.78){
      player.hanging=false; player.falling=true; player.vy=10; player.vx=0;
      Audio_.sfx('fall');
    }
  } else if(player.falling){
    player.vy -= 480*dt;
    player.alt += player.vy*dt;
    player.x += player.vx*dt;
    player.squash=0.85; player.squashY=1.2;
    if(player.alt < camera.alt - H*0.75){
      if(player.voidFall) endGame(); else loseLife();
    }
  } else if(player.ridingFall){
    // sitting on a platform that's crumbling away - falls down together with it
    const p=player.curPlat;
    if(p){ player.x=p.x; player.alt=p.alt; }
    player.squash=0.85; player.squashY=1.2;
    if(player.alt < camera.alt - H*0.75){
      player.ridingFall=false; player.curPlat=null;
      loseLife();
    }
  } else if(player.curPlat){
    // idle tracking - after 25 toshdan keyin turib qolish vaqti yarmiga qisqaradi
    const idleMult = jumpScore>=75 ? (0.8/IDLE_BREAK_T) : jumpScore>=50 ? 0.25 : (jumpScore>=25 ? 0.5 : 1);
    const warnT = IDLE_WARN_T*idleMult, breakT = IDLE_BREAK_T*idleMult;
    player.idle += dt;
    const p=player.curPlat;
    if(player.idle>warnT){
      p.shakeT = clamp((player.idle-warnT)/(breakT-warnT),0,1);
      p.crackLevel = p.shakeT>0.35?1:0; if(p.shakeT>0.7) p.crackLevel=2;
      if(Math.random()<dt*3) Audio_.sfx('crack');
      document.getElementById('idle-warn').style.opacity = p.shakeT;
    } else {
      document.getElementById('idle-warn').style.opacity=0;
    }
    if(player.idle>breakT){
      p.broken=true; p.falling=true; p.fallVy=10; p.fallGrav=240;
      player.ridingFall=true;
      Audio_.sfx('crack');
      spawnBurst(p.x,p.alt,'#8a6a4a',12);
    }
    player.squash=lerp(player.squash,1,dt*8);
    player.squashY=lerp(player.squashY,1,dt*8);
  }

  // falling-platform physics - applies to every stone currently marked as falling
  for(const p of platforms){
    if(p.falling){
      p.fallVy -= (p.fallGrav||480)*dt;
      p.alt += p.fallVy*dt;
    }
  }

  // camera
  const targetAlt = player.alt;
  camera.target = Math.max(camera.target, targetAlt - 40);
  camera.alt = lerp(camera.alt, camera.target, clamp(dt*4,0,1));
  camera.targetX = player.x;
  camera.x = lerp(camera.x, camera.targetX, clamp(dt*4,0,1));

  // generation & pruning
  genAheadTo(camera.alt+1500);
  pruneBelow(camera.alt-300);

  // ambient particles
  spawnAmbient(theme, camera.alt+H*0.6, camera.alt-H*0.5);

  // score
  const scoreM=jumpScore;
  document.getElementById('score-val').textContent=scoreM;
}

const VIEW_ZOOM = 0.72; // ko'rinishni uzoqlashtirish (zoom out) darajasi
function render(dt){
  const theme=THEMES[currentTheme];
  drawBackground(theme,dt);
  ctx.save();
  ctx.translate(W/2, H*VIEW_ANCHOR);
  ctx.scale(VIEW_ZOOM, VIEW_ZOOM);
  ctx.translate(-W/2, -H*VIEW_ANCHOR);
  drawAmbient(theme,dt);
  // platforms (only those on screen; sort so nearer/lower pillars draw over farther/higher ones)
  const sorted = platforms.slice().sort((a,b)=>b.alt-a.alt);
  for(const p of sorted) drawPlatform(theme,p);
  drawBurstParticles(dt);
  // player
  if(state===STATE.PLAY || state===STATE.PAUSE){
    const s=worldToScreen(player.x,player.alt);
    const bob = (!player.jumping && !player.falling && !player.hanging && !player.ridingFall)? Math.sin(performance.now()/500)*3 : 0;
    const flicker = player.invuln>0 ? (Math.sin(performance.now()/60)>0?0.35:1) : 1;
    let eyeClosed=false;
    if(player.hanging){
      const ht=player.hangT;
      eyeClosed = (ht>=0.12&&ht<0.24) || (ht>=0.42&&ht<0.54);
    }
    ctx.save(); ctx.globalAlpha=flicker;
    if(customPlayerImg){
      drawCustomPlayerAt(ctx, s.sx, s.sy-38, 34, player.squash, player.squashY, player.facing, bob);
    } else {
      drawCharacterAt(ctx, s.sx, s.sy-38, 34, theme, player.squash, player.squashY, player.facing, bob, null, eyeClosed, !player.everJumped);
    }
    ctx.restore();
  }
  ctx.restore();
  // vignette
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.9);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.28)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}

function frame(ts){
  const dt=Math.min((ts-lastT)/1000, 0.033);
  lastT=ts;
  if(state===STATE.PLAY){
    updateGame(dt);
    render(dt);
  } else if(state===STATE.PAUSE){
    render(0);
  } else if(state===STATE.MENU || state===STATE.SHOP || state===STATE.OVER){
    // idle ambient background render behind menu for polish
    const theme=THEMES[currentTheme];
    drawBackground(theme,dt);
    drawAmbient(theme,dt);
    spawnAmbient(theme, camera.alt+H*0.6, camera.alt-H*0.5);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* init */
goMenu();

})();
