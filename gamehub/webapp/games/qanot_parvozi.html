<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Qanot Parvozi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body {
    height:100%;
    background: linear-gradient(180deg,#1e3c72,#2a5298);
    font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    overflow:hidden;
    touch-action: manipulation;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #gameContainer{
    position:relative;
    width:400px;
    height:650px;
    max-width:96vw;
    max-height:96vh;
    aspect-ratio: 400/650;
    border-radius:22px;
    border:8px solid #6d4c1f;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5), inset 0 0 0 4px #ffd873;
    overflow:hidden;
    background:#87CEEB;
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
  }
  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:rgba(20,30,60,0.55);
    color:#fff;
    padding:20px;
  }
  .hidden{ display:none !important; }
  .title{
    font-size:38px;
    font-weight:900;
    color:#FFD54F;
    text-shadow: 3px 3px 0 #E65100, -1px -1px 0 #E65100, 1px -1px 0 #E65100, -1px 1px 0 #E65100;
    margin-bottom:6px;
    letter-spacing:1px;
  }
  .subtitle{
    font-size:14px;
    color:#fff;
    margin-bottom:22px;
    opacity:0.9;
  }
  .btn{
    font-family:inherit;
    font-size:20px;
    font-weight:800;
    color:#fff;
    padding:14px 34px;
    margin:8px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    background:linear-gradient(180deg,#66BB6A,#2E7D32);
    box-shadow: 0 6px 0 #1B5E20, 0 8px 14px rgba(0,0,0,0.35);
    transition: transform 0.08s ease;
  }
  .btn:active{
    transform: translateY(5px);
    box-shadow: 0 1px 0 #1B5E20, 0 2px 6px rgba(0,0,0,0.35);
  }
  .btn.orange{ background:linear-gradient(180deg,#FFA726,#EF6C00); box-shadow:0 6px 0 #E65100, 0 8px 14px rgba(0,0,0,0.35); }
  .btn.orange:active{ box-shadow:0 1px 0 #E65100, 0 2px 6px rgba(0,0,0,0.35); }
  .btn.blue{ background:linear-gradient(180deg,#4FC3F7,#0288D1); box-shadow:0 6px 0 #01579B, 0 8px 14px rgba(0,0,0,0.35); }
  .btn.blue:active{ box-shadow:0 1px 0 #01579B, 0 2px 6px rgba(0,0,0,0.35); }
  .scoreBox{
    background:rgba(255,255,255,0.12);
    border:2px solid rgba(255,255,255,0.4);
    border-radius:16px;
    padding:14px 26px;
    margin-bottom:18px;
    min-width:200px;
  }
  .scoreBox .row{
    display:flex;
    justify-content:space-between;
    font-size:16px;
    margin:4px 0;
  }
  .scoreBox .row b{ color:#FFD54F; font-size:20px; }
  #topBar{
    position:absolute;
    top:10px;
    left:0; right:0;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:0 10px;
    pointer-events:none;
    z-index:5;
  }
  #pauseBtn{
    pointer-events:all;
    width:42px; height:42px;
    border-radius:50%;
    border:2px solid #fff;
    background:rgba(0,0,0,0.35);
    color:#fff;
    font-size:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #liveScore{
    color:#fff;
    font-size:34px;
    font-weight:900;
    text-shadow:2px 2px 3px rgba(0,0,0,0.5);
  }
  .hint{ font-size:12px; opacity:0.85; margin-top:10px; }
  .newBest{
    color:#FFEE58;
    font-weight:900;
    font-size:15px;
    margin-top:4px;
    animation: pulse 1s infinite;
  }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.12);} }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="400" height="650"></canvas>

  <div id="topBar" class="hidden">
    <div id="liveScore">0</div>
    <button id="pauseBtn">❚❚</button>
  </div>

  <div id="menuOverlay" class="overlay">
    <div class="title">Qanot Parvozi</div>
    <div class="subtitle">Qushchani boshqarib, quvurlar orasidan uchib o'ting va tangalarni yig'ing!</div>
    <div class="scoreBox">
      <div class="row"><span>Eng yaxshi natija:</span><b id="menuBest">0</b></div>
    </div>
    <button class="btn" id="startBtn">▶ Boshlash</button>
    <div class="hint">Ekranga bosing yoki BO'SHLIQ tugmasini bosing — qanot qoqadi</div>
  </div>

  <div id="pauseOverlay" class="overlay hidden">
    <div class="title" style="font-size:30px;">Pauza</div>
    <button class="btn blue" id="resumeBtn">▶ Davom etish</button>
    <button class="btn orange" id="restartFromPauseBtn">↻ Qayta o'ynash</button>
  </div>

  <div id="gameOverOverlay" class="overlay hidden">
    <div class="title" style="font-size:32px; color:#FF7043; text-shadow:3px 3px 0 #B71C1C;">O'yin tugadi!</div>
    <div class="scoreBox">
      <div class="row"><span>Natijangiz:</span><b id="finalScore">0</b></div>
      <div class="row"><span>Eng yaxshi natija:</span><b id="finalBest">0</b></div>
    </div>
    <div class="newBest hidden" id="newBestLabel">🏆 YANGI REKORD!</div>
    <div id="submitStatus" class="hint"></div>
    <button class="btn orange" id="restartBtn">↻ Qayta o'ynash</button>
  </div>
</div>

<script>
(function(){
"use strict";

// ============ CANVAS SETUP ============
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const GROUND_H = 90;

// ============ UI ELEMENTS ============
const menuOverlay = document.getElementById('menuOverlay');
const pauseOverlay = document.getElementById('pauseOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const topBar = document.getElementById('topBar');
const liveScoreEl = document.getElementById('liveScore');
const menuBestEl = document.getElementById('menuBest');
const finalScoreEl = document.getElementById('finalScore');
const finalBestEl = document.getElementById('finalBest');

/* =========================================================================
   TELEGRAM WEBAPP INTEGRATION
   - Initializes the Telegram WebApp SDK.
   - Reads chat_id from the ?cid= URL parameter.
   - Submits the final score exactly once per finished run, via
     submitScore(), which is only ever called from endGame()
     (i.e. after the run has actually ended).
   ========================================================================= */
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

if(tg){
  try{
    tg.ready();
    tg.expand();
  }catch(e){ /* not fatal — game still works standalone for local testing */ }
}

function getUrlParam(name){
  try{ return new URLSearchParams(window.location.search).get(name); }
  catch(e){ return null; }
}
const CHAT_ID_RAW = getUrlParam('cid');
let CHAT_ID = Number(CHAT_ID_RAW);
if(!Number.isFinite(CHAT_ID)){ CHAT_ID = 0; }

const GAME_SLUG = "qanot_parvozi";

// Guards against ever submitting more than once for the same finished run.
let scoreSubmitted = false;
let finalGameScore = 0;

// Submits the score to the leaderboard backend. Only ever invoked by the
// "Natijani uzatish" button handler below — never automatically on game over.
async function submitScore(finalScore){
  if(scoreSubmitted) return;

  const initData = tg ? tg.initData : "";

  console.log("SCORE SUBMIT", {
    game: GAME_SLUG,
    score: Number(finalScore),
    init_data_received: Boolean(initData),
    init_data_length: initData ? initData.length : 0,
    chat_id: CHAT_ID
  });

  const res = await fetch('/api/scores', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      game: GAME_SLUG,
      score: Number(finalScore),
      init_data: initData,   // backend must verify this against the bot token; sent RAW, unmodified
      chat_id: CHAT_ID
    })
  });
  if(!res.ok) throw new Error('Score submission failed: ' + res.status);

  scoreSubmitted = true; // only mark as submitted once the request actually succeeded
}
const newBestLabel = document.getElementById('newBestLabel');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const resumeBtn = document.getElementById('resumeBtn');
const restartBtn = document.getElementById('restartBtn');
const restartFromPauseBtn = document.getElementById('restartFromPauseBtn');
const submitStatusEl = document.getElementById('submitStatus');

async function autoSubmitScore(finalScore){
  if(submitStatusEl) submitStatusEl.textContent = 'Natija yuborilmoqda...';
  try{
    await submitScore(finalScore);
    if(submitStatusEl) submitStatusEl.textContent = 'Natija yuborildi ✓';
  }catch(e){
    if(submitStatusEl) submitStatusEl.textContent = "Natijani yuborib bo'lmadi";
  }
}

// ============ STORAGE ============
const STORAGE_KEY = 'qanotParvoziBest';
function getBest(){ return parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10); }
function setBest(v){ localStorage.setItem(STORAGE_KEY, String(v)); }
menuBestEl.textContent = getBest();

// ============ AUDIO (Web Audio API synth, no external files) ============
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, duration, type, startGain, glideTo){
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if(glideTo){
    osc.frequency.exponentialRampToValueAtTime(glideTo, audioCtx.currentTime + duration);
  }
  gain.gain.setValueAtTime(startGain || 0.25, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
function playFlap(){ tone(480, 0.12, 'triangle', 0.2, 620); }
function playScore(){ tone(700, 0.09, 'square', 0.18, 950); setTimeout(()=>tone(950,0.12,'square',0.15,1200),60); }
function playCoin(){ tone(1200, 0.08, 'sine', 0.2, 1600); }
function playHit(){ tone(160, 0.35, 'sawtooth', 0.28, 60); }

// ============ GAME STATE ============
const STATE = { MENU:'menu', PLAYING:'playing', PAUSED:'paused', OVER:'over' };
let state = STATE.MENU;

const GRAVITY = 1500;
const FLAP_VELOCITY = -430;
let pipeSpeed = 150;
const PIPE_GAP = 165;
const PIPE_WIDTH = 66;
const PIPE_SPACING = 235;

let bird, pipes, coins, clouds, particles, score, coinCount, groundOffset, elapsed, lastTime, distSinceLastPipe;

function resetGame(){
  bird = {
    x: W*0.28,
    y: H*0.42,
    vy: 0,
    rotation: 0,
    wingPhase: 0,
    radius: 20
  };
  pipes = [];
  coins = [];
  particles = [];
  score = 0;
  coinCount = 0;
  groundOffset = 0;
  elapsed = 0;
  distSinceLastPipe = 999;
  pipeSpeed = 150;
  liveScoreEl.textContent = '0';
}

// ============ CLOUDS & MOUNTAINS (background, generated once) ============
clouds = [];
for(let i=0;i<6;i++){
  clouds.push({
    x: Math.random()*W,
    y: 40 + Math.random()*160,
    scale: 0.6 + Math.random()*0.9,
    speed: 8 + Math.random()*12
  });
}

// ============ INPUT ============
function doFlap(){
  if(state === STATE.PLAYING){
    bird.vy = FLAP_VELOCITY;
    bird.wingPhase = 0;
    playFlap();
    spawnFlapPuff();
  }
}
function spawnFlapPuff(){
  particles.push({x:bird.x-16, y:bird.y+8, vx:-60-Math.random()*40, vy:20+Math.random()*30, life:0.4, r:4+Math.random()*3});
}

canvas.addEventListener('pointerdown', (e)=>{
  e.preventDefault();
  if(state === STATE.MENU){ startGame(); }
  else if(state === STATE.PLAYING){ doFlap(); }
});
window.addEventListener('keydown', (e)=>{
  if(e.code === 'Space' || e.code === 'ArrowUp'){
    e.preventDefault();
    if(state === STATE.MENU){ startGame(); }
    else if(state === STATE.PLAYING){ doFlap(); }
    else if(state === STATE.PAUSED){ resumeGame(); }
  }
});

startBtn.addEventListener('click', startGame);
pauseBtn.addEventListener('click', togglePause);
resumeBtn.addEventListener('click', resumeGame);
restartBtn.addEventListener('click', startGame);
restartFromPauseBtn.addEventListener('click', startGame);

function startGame(){
  ensureAudio();
  resetGame();
  state = STATE.PLAYING;
  menuOverlay.classList.add('hidden');
  pauseOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
  topBar.classList.remove('hidden');
}
function togglePause(){
  if(state === STATE.PLAYING){
    state = STATE.PAUSED;
    pauseOverlay.classList.remove('hidden');
  } else if(state === STATE.PAUSED){
    resumeGame();
  }
}
function resumeGame(){
  state = STATE.PLAYING;
  pauseOverlay.classList.add('hidden');
  lastTime = performance.now();
}
function endGame(){
  state = STATE.OVER;
  playHit();
  topBar.classList.add('hidden');
  const best = getBest();
  const isNew = score > best;
  if(isNew) setBest(score);
  finalScoreEl.textContent = score;
  finalBestEl.textContent = isNew ? score : best;
  newBestLabel.classList.toggle('hidden', !isNew);
  gameOverOverlay.classList.remove('hidden');

  // Reset submit state for this new finished run, then submit automatically.
  finalGameScore = Number(score);
  scoreSubmitted = false;
  if(submitStatusEl) submitStatusEl.textContent = '';
  autoSubmitScore(finalGameScore);
}

// ============ SPAWNING ============
function spawnPipePair(){
  const margin = 70;
  const gapCenter = margin + Math.random()*(H - GROUND_H - margin*2 - PIPE_GAP) + PIPE_GAP/2;
  const hueShift = Math.random();
  pipes.push({
    x: W + PIPE_WIDTH,
    gapY: gapCenter,
    passed: false,
    hue: hueShift
  });
  // chance to spawn a coin in the gap
  if(Math.random() < 0.75){
    coins.push({
      x: W + PIPE_WIDTH,
      y: gapCenter + (Math.random()*40-20),
      collected:false,
      angle: Math.random()*Math.PI
    });
  }
}

// ============ UPDATE ============
function update(dt){
  elapsed += dt;

  // clouds drift
  for(const c of clouds){
    c.x -= c.speed*dt;
    if(c.x < -80){ c.x = W+80; c.y = 30+Math.random()*160; }
  }

  if(state !== STATE.PLAYING) return;

  // difficulty ramps slowly
  pipeSpeed = 150 + Math.min(70, score*2.2);

  // ground scroll
  groundOffset -= pipeSpeed*dt;
  if(groundOffset <= -40) groundOffset += 40;

  // bird physics
  bird.vy += GRAVITY*dt;
  bird.y += bird.vy*dt;
  bird.rotation = Math.max(-0.5, Math.min(1.3, bird.vy/500));
  bird.wingPhase += dt*14;

  // ceiling clamp
  if(bird.y - bird.radius < 0){ bird.y = bird.radius; bird.vy = 0; }

  // ground collision
  if(bird.y + bird.radius >= H - GROUND_H){
    bird.y = H - GROUND_H - bird.radius;
    endGame();
    return;
  }

  // pipes
  distSinceLastPipe += pipeSpeed*dt;
  if(distSinceLastPipe >= PIPE_SPACING){
    distSinceLastPipe = 0;
    spawnPipePair();
  }
  for(const p of pipes){
    p.x -= pipeSpeed*dt;
    if(!p.passed && p.x + PIPE_WIDTH < bird.x){
      p.passed = true;
      score++;
      liveScoreEl.textContent = score;
      playScore();
    }
    // collision check (circle vs two rects)
    const topRectH = p.gapY - PIPE_GAP/2;
    const bottomRectY = p.gapY + PIPE_GAP/2;
    if(circleRectCollide(bird.x, bird.y, bird.radius*0.78, p.x, 0, PIPE_WIDTH, topRectH) ||
       circleRectCollide(bird.x, bird.y, bird.radius*0.78, p.x, bottomRectY, PIPE_WIDTH, H-GROUND_H-bottomRectY)){
      endGame();
      return;
    }
  }
  pipes = pipes.filter(p => p.x > -PIPE_WIDTH-10);

  // coins
  for(const c of coins){
    c.x -= pipeSpeed*dt;
    c.angle += dt*4;
    if(!c.collected){
      const dx = bird.x - c.x, dy = bird.y - c.y;
      if(Math.sqrt(dx*dx+dy*dy) < bird.radius + 14){
        c.collected = true;
        coinCount++;
        score += 3;
        liveScoreEl.textContent = score;
        playCoin();
        for(let i=0;i<8;i++){
          particles.push({
            x:c.x, y:c.y,
            vx:(Math.random()*2-1)*120, vy:(Math.random()*2-1)*120,
            life:0.5, r:2+Math.random()*2, color:'#FFD54F'
          });
        }
      }
    }
  }
  coins = coins.filter(c => c.x > -30 && !c.collected || (c.x > -30));

  // particles
  for(const pt of particles){
    pt.x += pt.vx*dt;
    pt.y += pt.vy*dt;
    pt.vy += 200*dt;
    pt.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}

function circleRectCollide(cx, cy, cr, rx, ry, rw, rh){
  const nearestX = Math.max(rx, Math.min(cx, rx+rw));
  const nearestY = Math.max(ry, Math.min(cy, ry+rh));
  const dx = cx - nearestX, dy = cy - nearestY;
  return (dx*dx + dy*dy) < (cr*cr);
}

// ============ DRAWING ============
function drawBackground(){
  // sky
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0, '#63C7F2');
  sky.addColorStop(0.6, '#9FDBF0');
  sky.addColorStop(1, '#D6F0EE');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  // sun
  ctx.save();
  const sunGrad = ctx.createRadialGradient(340,70,4,340,70,50);
  sunGrad.addColorStop(0,'rgba(255,255,220,0.95)');
  sunGrad.addColorStop(1,'rgba(255,255,220,0)');
  ctx.fillStyle = sunGrad;
  ctx.beginPath(); ctx.arc(340,70,50,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#FFF9C4';
  ctx.beginPath(); ctx.arc(340,70,22,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // far mountains
  drawMountainLayer(H-GROUND_H-40, 55, '#8DA6C4', 0.15);
  // near mountains
  drawMountainLayer(H-GROUND_H-10, 80, '#6C8EB0', 0.28);

  // clouds
  for(const c of clouds) drawCloud(c.x, c.y, c.scale);
}

function drawMountainLayer(baseY, amp, color, opacity){
  ctx.save();
  ctx.globalAlpha = opacity + 0.72;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, baseY);
  const step = 66;
  for(let x=0; x<=W+step; x+=step){
    const peak = baseY - amp*(0.5+0.5*Math.sin(x*0.013 + baseY));
    ctx.lineTo(x, peak);
  }
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawCloud(x,y,scale){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath();
  ctx.arc(0,0,20,Math.PI*0.5,Math.PI*1.5);
  ctx.arc(14,-16,16,Math.PI*1,Math.PI*2);
  ctx.arc(34,0,20,Math.PI*1.5,Math.PI*0.5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawGround(){
  const groundY = H - GROUND_H;
  const grad = ctx.createLinearGradient(0, groundY, 0, H);
  grad.addColorStop(0, '#8BC34A');
  grad.addColorStop(0.18, '#689F38');
  grad.addColorStop(0.18, '#A1887F');
  grad.addColorStop(1, '#795548');
  ctx.fillStyle = grad;
  ctx.fillRect(0, groundY, W, GROUND_H);

  // grass tufts scrolling
  ctx.fillStyle = '#558B2F';
  for(let x = groundOffset-40; x<W; x+=40){
    ctx.beginPath();
    ctx.moveTo(x, groundY+10);
    ctx.lineTo(x+8, groundY-6);
    ctx.lineTo(x+16, groundY+10);
    ctx.closePath();
    ctx.fill();
  }
  // dirt dots
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  for(let x = groundOffset-40; x<W; x+=27){
    ctx.beginPath();
    ctx.arc(x+13, groundY+40+((x*7)%20), 3, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawPipes(){
  const groundY = H - GROUND_H;
  for(const p of pipes){
    const topH = p.gapY - PIPE_GAP/2;
    const bottomY = p.gapY + PIPE_GAP/2;

    const baseColors = [
      ['#8BE06E','#4CAF50','#2E7D32'],
      ['#7FD8E8','#29B6D6','#00697F'],
      ['#FFC067','#FFA726','#E65100']
    ];
    const cset = baseColors[Math.floor(p.hue*baseColors.length) % baseColors.length];

    drawPipeSegment(p.x, 0, topH, cset, true);
    drawPipeSegment(p.x, bottomY, groundY-bottomY, cset, false);
  }
}

function drawPipeSegment(x, y, h, cset, isTop){
  if(h<=0) return;
  const grad = ctx.createLinearGradient(x,0,x+PIPE_WIDTH,0);
  grad.addColorStop(0, cset[2]);
  grad.addColorStop(0.35, cset[1]);
  grad.addColorStop(0.6, cset[0]);
  grad.addColorStop(1, cset[2]);

  const capH = 22;
  ctx.fillStyle = grad;

  if(isTop){
    ctx.fillRect(x, y, PIPE_WIDTH, h-capH);
    roundRectFill(x-5, y+h-capH, PIPE_WIDTH+10, capH, 6, grad);
  } else {
    roundRectFill(x-5, y, PIPE_WIDTH+10, capH, 6, grad);
    ctx.fillRect(x, y+capH, PIPE_WIDTH, h-capH);
  }

  ctx.strokeStyle = cset[2];
  ctx.lineWidth = 2;
  if(isTop){
    ctx.strokeRect(x, y, PIPE_WIDTH, h-capH);
    ctx.strokeRect(x-5, y+h-capH, PIPE_WIDTH+10, capH);
  } else {
    ctx.strokeRect(x-5, y, PIPE_WIDTH+10, capH);
    ctx.strokeRect(x, y+capH, PIPE_WIDTH, h-capH);
  }
  // highlight stripe
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fillRect(x+10, y, 8, h);
}

function roundRectFill(x,y,w,h,r,fillStyle){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  ctx.fillStyle = fillStyle;
  ctx.fill();
}

function drawCoins(){
  for(const c of coins){
    if(c.collected) continue;
    ctx.save();
    ctx.translate(c.x, c.y + Math.sin(elapsed*3 + c.x)*4);
    const squish = Math.cos(c.angle);
    ctx.scale(Math.max(0.12, Math.abs(squish)), 1);
    const grad = ctx.createRadialGradient(-4,-4,1,0,0,13);
    grad.addColorStop(0, '#FFFDE7');
    grad.addColorStop(0.55, '#FFD54F');
    grad.addColorStop(1, '#F57F17');
    ctx.beginPath();
    ctx.arc(0,0,13,0,Math.PI*2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#E65100';
    ctx.lineWidth = 2;
    ctx.stroke();
    if(Math.abs(squish) > 0.4){
      ctx.fillStyle = '#E65100';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('$', 0, 1);
    }
    ctx.restore();
  }
}

function drawParticles(){
  for(const p of particles){
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life*2);
    ctx.fillStyle = p.color || 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function drawBird(){
  const x = bird.x, y = bird.y;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(bird.rotation);

  // shadow
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(0, 34, 16, 5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // tail feathers
  ctx.beginPath();
  ctx.moveTo(-16,-2);
  ctx.lineTo(-27,-9);
  ctx.lineTo(-22,0);
  ctx.lineTo(-27,9);
  ctx.lineTo(-16,4);
  ctx.closePath();
  ctx.fillStyle = '#FB8C00';
  ctx.fill();
  ctx.strokeStyle = '#E65100';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // body
  const bodyGrad = ctx.createRadialGradient(-6,-8,3,2,0,26);
  bodyGrad.addColorStop(0, '#FFF59D');
  bodyGrad.addColorStop(0.55, '#FFEB3B');
  bodyGrad.addColorStop(1, '#FFA000');
  ctx.beginPath();
  ctx.moveTo(19,0);
  ctx.bezierCurveTo(19,-15, 6,-21, -9,-17);
  ctx.bezierCurveTo(-23,-14,-23,14,-9,17);
  ctx.bezierCurveTo(6,21,19,15,19,0);
  ctx.closePath();
  ctx.fillStyle = bodyGrad;
  ctx.fill();
  ctx.strokeStyle = '#E65100';
  ctx.lineWidth = 2;
  ctx.stroke();

  // wing (flap animation)
  const wingAngle = Math.sin(bird.wingPhase) * 0.85 - 0.15;
  ctx.save();
  ctx.translate(-3, 3);
  ctx.rotate(wingAngle);
  const wingGrad = ctx.createLinearGradient(0,-10,0,16);
  wingGrad.addColorStop(0, '#FFF9C4');
  wingGrad.addColorStop(1, '#FB8C00');
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.quadraticCurveTo(-17,-7,-19,9);
  ctx.quadraticCurveTo(-8,17,4,10);
  ctx.quadraticCurveTo(7,4,0,0);
  ctx.closePath();
  ctx.fillStyle = wingGrad;
  ctx.fill();
  ctx.strokeStyle = '#E65100';
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.restore();

  // cheek blush
  ctx.beginPath();
  ctx.arc(1,7,3.4,0,Math.PI*2);
  ctx.fillStyle = 'rgba(255,110,110,0.45)';
  ctx.fill();

  // eye white
  ctx.beginPath();
  ctx.arc(9,-7,6.2,0,Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#33291a';
  ctx.lineWidth = 1;
  ctx.stroke();
  // pupil
  ctx.beginPath();
  ctx.arc(11.3,-6.6,3.1,0,Math.PI*2);
  ctx.fillStyle = '#26201a';
  ctx.fill();
  // shine
  ctx.beginPath();
  ctx.arc(13,-8.2,1.1,0,Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  // beak
  ctx.beginPath();
  ctx.moveTo(16,-3);
  ctx.lineTo(29,1);
  ctx.lineTo(16,6);
  ctx.closePath();
  const beakGrad = ctx.createLinearGradient(16,0,29,0);
  beakGrad.addColorStop(0, '#FFB300');
  beakGrad.addColorStop(1, '#FF6F00');
  ctx.fillStyle = beakGrad;
  ctx.fill();
  ctx.strokeStyle = '#E65100';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.restore();
}

function drawGetReadyHint(){
  if(state !== STATE.MENU) return;
  // small idle bob preview handled by bird position in menu; nothing extra needed
}

// ============ MAIN LOOP ============
function render(){
  drawBackground();
  drawPipes();
  drawCoins();
  drawParticles();
  drawBird();
  drawGround();
}

function loop(now){
  if(!lastTime) lastTime = now;
  let dt = (now - lastTime)/1000;
  dt = Math.min(dt, 0.033); // clamp to avoid big jumps
  lastTime = now;

  if(state === STATE.MENU){
    // gentle bob for preview bird
    bird.wingPhase += dt*8;
    bird.y = H*0.42 + Math.sin(elapsed*2)*10;
    elapsed += dt;
    for(const c of clouds){
      c.x -= c.speed*dt;
      if(c.x < -80){ c.x = W+80; c.y = 30+Math.random()*160; }
    }
    groundOffset -= 60*dt;
    if(groundOffset <= -40) groundOffset += 40;
  } else {
    update(dt);
  }

  render();
  requestAnimationFrame(loop);
}

// init
resetGame();
requestAnimationFrame(loop);

})();
</script>
